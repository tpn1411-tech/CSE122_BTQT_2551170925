<body>
    <div class="header">
        <h1>Bốn Mùa</h1>
    </div>
    <div class="main">
        <div class="kho_1">
            <p>
                Xuân về hoa nở khắp trời <br>
                Hạ sang năng cháy rạng ngời phố quen <br>
                Thu về lá rụng bên thềm <br>
            </p>
            <hr>
        </div>
        <div class="kho_2">
            <p>
                Đông sang gió lạng bên em đợi chờ <br>
                Bốn mùa là bốn giấc mơ <br>
                Thời  gian đi mãi ta chờ đợi ai <br>
            </p>
            <hr>
        </div>
        <div class="kho_3">
            <p>
                Một năm rồi lại trôi qua <br>
                Vẫn còn câu hát thì thầm quê hương <br>
                Chờ xuân nắng mới soi đường <br>
            </p>
        </div>
    </div>
</body>
