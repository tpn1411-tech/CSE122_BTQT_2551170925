
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="title">
            <div class="title-heading">Thư viện ảnh Việt Nam</div>
            <div class="title-description">
                Bộ sưu tập 6 danh thắng tiêu biểu — minh họa thẻ figure / figcaption.
            </div>
        </div>

        <div class="gallery">
            <div class="photo-card">
                <div class="photo-image">
                    <img src="image/1-vinh-ha-long.jpg" alt="Vịnh Hạ Long">
                </div>
                <div class="photo-caption">Hình 1. Vịnh Hạ Long</div>
            </div>

            <div class="photo-card">
                <div class="photo-image">
                    <img src="image/2-son-doong.jpg" alt="Hang Sơn Đoòng">
                </div>
                <div class="photo-caption">Hình 2. Hang Sơn Đoòng</div>
            </div>

            <div class="photo-card">
                <div class="photo-image">
                    <img src="image/3-thac-ban-gioc.jpg" alt="Thác Bản Giốc">
                </div>
                <div class="photo-caption">Hình 3. Thác Bản Giốc</div>
            </div>

            <div class="photo-card">
                <div class="photo-image">
                    <img src="image/4-fansipan.jpg" alt="Fansipan">
                </div>
                <div class="photo-caption">Hình 4. Fansipan</div>
            </div>

            <div class="photo-card">
                <div class="photo-image">
                    <img src="image/5-mekong.jpg" alt="Đồng bằng sông Cửu Long">
                </div>
                <div class="photo-caption">Hình 5. Đồng bằng sông Cửu Long</div>
            </div>

            <div class="photo-card">
                <div class="photo-image">
                    <img src="image/6-phong-nha.jpg" alt="Động Phong Nha">
                </div>
                <div class="photo-caption">Hình 6. Động Phong Nha</div>
            </div>
        </div>
    </div>
</body>
</html>
