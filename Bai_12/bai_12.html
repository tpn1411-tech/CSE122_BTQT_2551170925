
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <div class="calendar">
            <p class="year" id="display-year">2026</p>
            <h1 class="month" id="display-month">Tháng 12</h1>
            <p class="day" id="display-day">24</p>
            <p class="weekday" id="display-weekday">Thứ năm</p>
        </div>

        <p class="greeting" id="greeting">Chào buổi tối!</p>

        <form class="date-form" id="date-form">
            <div class="form-group">
                <label for="day">Ngày</label>
                <input type="number" id="day" min="1" max="31" value="24">
            </div>

            <div class="form-group">
                <label for="month">Tháng</label>
                <input type="number" id="month" min="1" max="12" value="12">
            </div>

            <div class="form-group">
                <label for="year">Năm</label>
                <input type="number" id="year" min="1" value="2026">
            </div>

            <button type="submit">In<br>lịch</button>
        </form>

        <p class="error" id="error-message"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
