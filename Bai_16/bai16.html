
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách việc cần làm</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="todo-app">

        <div class="header">
            <h1>Danh sách việc cần làm</h1>
            <p>Thêm việc mới, đánh dấu hoàn thành hoặc xoá — tất cả bằng JavaScript.</p>
        </div>

        <div class="input-area">
            <input type="text" id="todo-input" placeholder="Nhập công việc cần làm...">
            <button id="add-btn">Thêm</button>
        </div>

        <div class="todo-content">
            <ul id="todo-list"></ul>
            <p id="todo-count">Còn 0 việc chưa hoàn thành</p>
        </div>

    </div>

</body>
</html>
