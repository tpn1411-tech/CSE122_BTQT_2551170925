<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 23 - Thư viện ảnh</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header class="page-heading">
            <h1>Thư viện ảnh — Hiệu ứng Hover</h1>
            <p>Rê chuột lên ảnh để thấy hiệu ứng phóng to (zoom) và lớp phủ chú thích.</p>
        </header>

        <section class="gallery">
            <article class="photo-card">
                <img src="image/1-vinh-ha-long.jpg" alt="Bãi biển">
                <div class="caption">Vịnh Hạ Long</div>
            </article>
            <article class="photo-card">
                <img src="image/2-son-doong.jpg" alt="Núi đá">
                <div class="caption">Hang Sơn Đoòng</div>
            </article>
            <article class="photo-card">
                <img src="image/3-thac-ban-gioc.jpg" alt="Thác nước">
                <div class="caption">Thác Bản Giốc</div>
            </article>
            <article class="photo-card">
                <img src="image/4-fansipan.jpg" alt="Núi trong mây">
                <div class="caption">Fansipan</div>
            </article>
            <article class="photo-card">
                <img src="image/5-mekong.jpg" alt="Sông và thuyền">
                <div class="caption">Đồng bằng sông Cửu Long</div>
            </article>
            <article class="photo-card">
                <img src="image/6-phong-nha.jpg" alt="Cảnh thiên nhiên">
                <div class="caption">Động Phong Nha</div>
            </article>
        </section>
    </main>
</body>
</html>
