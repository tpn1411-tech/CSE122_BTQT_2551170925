
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 26 - Form đăng ký CLB</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card register-card">

            <div class="card-header">
                Đăng ký tham gia CLB Lập trình Web
            </div>

            <div class="card-body">
                <form id="register-form">

                    <div class="row g-2">
                        <div class="col-12 col-md-6">
                            <label for="fullname" class="form-label">Họ và tên</label>
                            <input type="text" class="form-control" id="fullname"
                                placeholder="Nguyễn Văn A" required>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="student-id" class="form-label">Mã sinh viên</label>
                            <input type="text" class="form-control" id="student-id"
                                placeholder="22xxxxxx" required>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email"
                                placeholder="sv@tlu.edu.vn" required>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="phone" class="form-label">Số điện thoại</label>
                            <input type="tel" class="form-control" id="phone"
                                placeholder="09xxxxxxxx"
                                pattern="0[0-9]{9}"
                                title="Số điện thoại gồm 10 chữ số và bắt đầu bằng 0"
                                required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Trình độ</label>

                        <div class="d-flex gap-3">
                            <div class="form-check">
                                <input type="radio" class="form-check-input"
                                    name="level" id="basic" value="Cơ bản" required checked>
                                <label class="form-check-label" for="basic">Cơ bản</label>
                            </div>

                            <div class="form-check">
                                <input type="radio" class="form-check-input"
                                    name="level" id="medium" value="Khá">
                                <label class="form-check-label" for="medium">Khá</label>
                            </div>

                            <div class="form-check">
                                <input type="radio" class="form-check-input"
                                    name="level" id="good" value="Tốt">
                                <label class="form-check-label" for="good">Tốt</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="class-name" class="form-label">Chọn lớp</label>

                        <select class="form-select" id="class-name" required>
                            <option value="67CNTT1">67CNTT1</option>
                            <option value="67CNTT2">67CNTT2</option>
                            <option value="67CNTT3">67CNTT3</option>
                        </select>
                    </div>

                    <div class="form-check commitment">
                        <input type="checkbox" class="form-check-input"
                            id="commitment" required>
                        <label class="form-check-label" for="commitment">
                            Tôi cam kết tự làm bài và quay video OBS
                        </label>
                    </div>

                    <div class="form-message" id="message"></div>

                    <div class="d-flex justify-content-end gap-2 mt-3">
                        <button type="reset" class="btn btn-outline-secondary">
                            Nhập lại
                        </button>

                        <button type="submit" class="btn btn-success">
                            Đăng ký
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <footer>
        <p>© CSE.TLU - Chinh phục tri thức</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
