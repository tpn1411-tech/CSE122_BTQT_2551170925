
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 30 - Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <aside class="sidebar">
            <h1 class="logo">CSE.TLU Admin</h1>

            <nav class="menu">
                <a href="#" class="menu-link active" data-page="Bảng điều khiển">
                    Bảng điều khiển
                </a>
                <a href="#" class="menu-link" data-page="Bài tập">
                    Bài tập
                </a>
                <a href="#" class="menu-link" data-page="Sinh viên">
                    Sinh viên
                </a>
                <a href="#" class="menu-link" data-page="Điểm số">
                    Điểm số
                </a>
            </nav>
        </aside>

        <main class="main-content">

            <header class="topbar">
                <h2 id="page-title">Bảng điều khiển</h2>

                <div class="topbar-actions">
                    <button type="button" class="btn btn-warning" id="sample-btn">
                        Bài mẫu
                    </button>

                    <button type="button" class="btn btn-primary" id="export-btn">
                        Xuất báo cáo
                    </button>
                </div>
            </header>

            <section class="row g-2 statistics" id="statistics">

                <div class="col-6 col-lg-3">
                    <div class="stat-card">
                        <p>Sinh viên</p>
                        <h3>128</h3>
                        <div class="progress">
                            <div class="progress-bar bg-primary" style="width: 100%"></div>
                        </div>
                    </div>
                </div>

                <div class="col-6 col-lg-3">
                    <div class="stat-card">
                        <p>Đã nộp</p>
                        <h3>96</h3>
                        <div class="progress">
                            <div class="progress-bar bg-success" style="width: 75%"></div>
                        </div>
                    </div>
                </div>

                <div class="col-6 col-lg-3">
                    <div class="stat-card">
                        <p>Chưa nộp</p>
                        <h3>32</h3>
                        <div class="progress">
                            <div class="progress-bar bg-danger" style="width: 25%"></div>
                        </div>
                    </div>
                </div>

                <div class="col-6 col-lg-3">
                    <div class="stat-card">
                        <p>Điểm TB</p>
                        <h3>7.8</h3>
                        <div class="progress">
                            <div class="progress-bar bg-warning" style="width: 78%"></div>
                        </div>
                    </div>
                </div>

            </section>

            <section class="chapter-section">
                <h3>Tiến độ theo chương</h3>
                <div id="chapter-list"></div>
            </section>

            <div id="message" class="mt-2"></div>

        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
